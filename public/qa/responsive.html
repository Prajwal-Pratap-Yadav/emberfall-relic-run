<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMBERFALL · Responsive QA</title><style>body{margin:0;background:#0b181a;color:#eeeede;font:14px system-ui;padding:18px}h1{font-size:20px;margin:0 0 8px}p{color:#a5b6af;max-width:900px}button{background:#ffb56d;border:0;padding:10px 16px;color:#142526;margin:0 8px 12px 0;cursor:pointer}iframe{display:block;border:1px solid #91b5a5;background:#0b181a;max-width:none}output{font-size:13px;color:#b5dec3}</style></head><body><h1>Responsive gameplay QA</h1><p>This same-origin viewer sets a real iframe viewport for layout and pointer checks. It does not emulate touch hardware, network conditions or CPU throttling. Online play still requires a working direct peer connection.</p><button data-w="844" data-h="390">Landscape 844 × 390</button><button data-w="390" data-h="844">Portrait 390 × 844</button><output>844 × 390</output><iframe title="Game test viewport" src="/" width="844" height="390" allow="fullscreen"></iframe><script>for(const b of document.querySelectorAll('button'))b.addEventListener('click',()=>{const f=document.querySelector('iframe');f.width=b.dataset.w;f.height=b.dataset.h;document.querySelector('output').textContent=f.width+' × '+f.height})</script></body></html>
